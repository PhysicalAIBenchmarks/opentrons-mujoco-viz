[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentrons-mujoco-viz"
version = "0.1.0"
description = "MuJoCo 3D visualisation of Opentrons OT-2 protocols, driven by opentrons_simulate run logs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "PhysicalAIBenchmarks", email = "niall@example.com"},
]
keywords = [
    "opentrons", "mujoco", "simulation", "robotics", "lab-automation",
    "bioinformatics", "synthetic-biology", "visualization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "mujoco>=3.0.0",
    "numpy>=1.24",
    "imageio[ffmpeg]>=2.28",
]

[project.urls]
Homepage = "https://github.com/PhysicalAIBenchmarks/opentrons-mujoco-viz"
Repository = "https://github.com/PhysicalAIBenchmarks/opentrons-mujoco-viz"
Issues = "https://github.com/PhysicalAIBenchmarks/opentrons-mujoco-viz/issues"

[project.optional-dependencies]
opentrons = [
    "opentrons==7.5.0",
    "opentrons-shared-data==7.5.0",
    "pydantic<2",
]
dev = [
    "opentrons==7.5.0",
    "opentrons-shared-data==7.5.0",
    "pydantic<2",
    "trimesh",
    "matplotlib",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["opentrons.visualization*"]
namespaces = true

[tool.setuptools.package-data]
"opentrons.visualization" = ["assets/*.xml", "assets/*.obj", "assets/*.json"]
